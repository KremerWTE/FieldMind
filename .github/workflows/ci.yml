name: CI

on:
  push:
    branches: [main, kremer-dev]
  pull_request:
    branches: [main]

jobs:
  # ─── .NET API ──────────────────────────────────────────────────────────────
  api:
    name: API (build + test)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: fieldmind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=fieldmind_test;Username=postgres;Password=postgres"
      JWT__Secret: "ci-test-jwt-secret-must-be-at-least-32-chars-long"
      ASPNETCORE_ENVIRONMENT: Development

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore API dependencies
        run: dotnet restore apps/api/FieldMind.Api.csproj

      - name: Build API
        run: dotnet build apps/api/FieldMind.Api.csproj --no-restore -c Release

      - name: Restore test dependencies
        run: dotnet restore apps/api.tests/FieldMind.Api.Tests.csproj

      - name: Run tests
        run: dotnet test apps/api.tests/FieldMind.Api.Tests.csproj --no-restore -v normal

  # ─── Next.js Web ──────────────────────────────────────────────────────────
  web:
    name: Web (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build -w @fieldmind/web
        env:
          NEXT_IGNORE_INCORRECT_LOCKFILE: "1"
          NEXT_PUBLIC_API_URL: "http://localhost:3001"

  # ─── Docker image ─────────────────────────────────────────────────────────
  docker:
    name: Docker (build)
    runs-on: ubuntu-latest
    needs: [api]
    # Only build Docker image on pushes to main/kremer-dev (not PRs)
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t fieldmind-api:${{ github.sha }} apps/api/
