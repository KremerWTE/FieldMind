apiVersion: 1

datasources:
  - name: FieldMind PostgreSQL
    type: postgres
    access: proxy
    url: host.docker.internal:5432
    database: fieldmind
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
      maxOpenConns: 10
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: true
    isDefault: true
